name: Template cleanup

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !github.event.repository.is_template && github.event.repository.name != 'RaylibSwitch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rename project
        env:
          NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ ! -f .template-cleanup ]; then
            echo "Already cleaned up."
            exit 0
          fi

          grep -rlI --exclude-dir=.git --exclude-dir=.github RaylibSwitch . \
            | xargs -r sed -i "s/RaylibSwitch/${NAME}/g"
          sed -i "s/^set(APP_AUTHOR \"[^\"]*\"/set(APP_AUTHOR \"${OWNER}\"/" CMakeLists.txt
          rm .template-cleanup

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Template cleanup: rename project to ${NAME}"
          git push
