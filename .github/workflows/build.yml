name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake, Ninja and Switch portlibs
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates unzip git
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz \
            | tar -xz -C /opt
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q /tmp/ninja.zip -d /usr/local/bin
          dkp-pacman -Sy --noconfirm --needed switch-mesa switch-libdrm_nouveau

      - name: Configure
        run: cmake --preset switch-release

      - name: Build
        run: cmake --build --preset switch-release

      - uses: actions/upload-artifact@v4
        with:
          name: nro
          path: build/switch-release/*.nro
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/switch-release/*.nro
